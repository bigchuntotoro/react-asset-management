server:
  port: 8081

spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    # serverTimezone, useSSL 등의 옵션을 URL에 명시
    url: jdbc:mariadb://localhost:3306/reactdb?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC
    # 보안을 위해 환경 변수에서 가져오고, 값이 없을 경우 기본값(:totoro) 사용
    username: ${SPRING_DATASOURCE_USERNAME:totoro}
    password: ${SPRING_DATASOURCE_PASSWORD:totoro}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.asset.dto
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    # 요청하신 대로 Mapper 패키지의 디버그 로그 레벨 지정
    com.example.asset.mapper: debug