server:
  port: 8081

spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/reactdb?useSSL=false&characterEncoding=UTF-8
    username: totoro
    password: totoro
  # JPA / Hibernate SQL 출력 활성화
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true # SQL 구문을 정돈해서 보기 쉽게 출력

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.asset.dto
  configuration:
    map-underscore-to-camel-case: true

# SQL 바인딩 파라미터(?) 값 로그 출력 레벨 설정
logging:
  level:
    org.hibernate.SQL: debug              # 실행되는 SQL문 출력
    org.hibernate.type.descriptor.sql: trace # SQL에 바인딩되는 실제 값(?) 출력